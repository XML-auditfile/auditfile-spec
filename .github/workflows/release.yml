name: Release

# Run manually with the new version, e.g. 1.0.1 or 1.1.0-beta.1:
# - from main: the version must be higher than every existing release;
# - from release/X.Y (maintenance of an older line, e.g. a fix 0.1.1 after 1.0.0):
#   the version must be in line X.Y and higher than the latest release in that line.
#   Branch release/X.Y off the tag of that line, e.g. git switch -c release/0.1 0.1.0.
# Either way the commit must hold commits that the previous release does not.
# Checks the version, creates the tag, builds, checks generated/, zips it, pushes the tag
# and creates the GitHub release with the zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (semver without prefix, e.g. 1.0.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, for the version check

      - name: Check version
        id: version
        shell: pwsh
        run: |
          . ./tools/semver.ps1
          $isLatest = Assert-ReleaseVersion $env:VERSION $env:GITHUB_REF @(git tag --list) $env:GITHUB_SHA
          "latest=$($isLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # Local only; pushed after build, check and zip have succeeded.
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build auditfile-spec.slnx -c Release -p:Version=$VERSION

      - name: Check generated
        run: dotnet run --project tools/Generator -c Release --no-build -- --check

      - name: Zip generated
        run: zip -r "auditfile-spec-$VERSION.zip" generated

      - name: Push tag
        run: git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$VERSION" "auditfile-spec-$VERSION.zip" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            --latest="$LATEST" \
            $prerelease
